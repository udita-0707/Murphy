# Local infrastructure for Murphy.
#
# Credentials come from the repo-root .env (see .env.example), so run compose with it:
#   docker compose --env-file .env -f infra/docker-compose.yml up -d --wait
# or `pnpm infra:up`.
#
# Ports are published on 127.0.0.1 only. The host port defaults to 54320 so it does not clash
# with a locally installed Postgres; override with MURPHY_PG_PORT.
name: murphy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:${MURPHY_PG_PORT:-54320}:5432"
    volumes:
      - murphy-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  murphy-pgdata:
